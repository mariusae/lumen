name: Lumen

options:
  bundleIdPrefix: com.lumen
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
        excludes:
          - "Resources/web/**"
    resources:
      - path: Lumen/Resources
        excludes:
          - "web/**"
      - path: Lumen/Resources/web
        buildPhase: resources
        type: folder
      - path: Lumen/Bridge/bridge.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumen.app
        INFOPLIST_FILE: Lumen/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Lumen.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_XR_DESIGNED_FOR: false
    entitlements:
      path: Lumen.entitlements
    dependencies:
      - target: LumenShareExtension
    preBuildScripts:
      - name: Copy Web Assets
        script: |
          "${PROJECT_DIR}/scripts/copy-web-assets.sh"
        basedOnDependencyAnalysis: false

  LumenShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - LumenShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumen.app.share
        INFOPLIST_FILE: LumenShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: LumenShareExtension.entitlements
        SKIP_INSTALL: true
    entitlements:
      path: LumenShareExtension.entitlements

schemes:
  Lumen:
    build:
      targets:
        Lumen: all
        LumenShareExtension: all
    run:
      config: Debug
      executable: Lumen
